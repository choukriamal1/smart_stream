<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>smart-stream-tv</title>
        <link rel="stylesheet" href="css/style.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss"></style>
        

        <link rel="icon" type="image/svg+xml" href="img/logo - Copie.jpg">
        
    </head>
    
    <body class=" mx-auto w-full ">




        


<div class="flex flex-row">
        <aside class="w-[340px] h-[800px] border-r border-white/5 bg-slate-900 p-5 overflow-auto ">

            <div>
                <span class="bg-blue-300">
                    <img src="img/logo.jpg" class="flex w-30 py-3">
                </span>
                
            </div>

            <input id="search" type="text" placeholder="Nom ou n° de chaine" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-slate-200 placeholder-slate-500 outline-none ">
            
                
                <div class="pt-6 pb-3">
                    <p class="text-sm font-bold  text-slate-500">Choisir un pays</p>
                    <p class="mt-1 text-sm text-slate-600">Sélectionnez un pays pour afficher ses chaînes.</p>
                </div>

                <div class="flex space-y-2 py-5">
                    
                    <button type="button" data-country="MA" class="btn-pays flex h-16 w-full items-center gap-3 rounded-xl border border-white/5 bg-white/[0.03] px-3 text-left transition hover:border-indigo-400/20 hover:bg-white/[.06]">
                        
                        <span class="grid h-10 px-2 place-items-center rounded-lg  bg-gradient-to-br from-red-600 text-xs font-bold text-white">MA</span>
                        
                        <span class="min-w-0 flex-1">
                            <span class="block text-sm font-semibold text-slate-200">Maroc</span>
                            <span class="mt-0.5 block text-[11px] text-slate-500">15 chaînes en direct</span>
                        </span>


                        <svg class="h-4 w-4 text-slate-500 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>


                    </button>
                </div>

                <!-- fr -->
                <div class=" space-y-2 ">
                    
                    <button type="button" data-country="FR" class="btn-pays flex h-16 w-full items-center gap-3 rounded-xl border border-white/5 bg-white/[0.03] px-3 text-left transition hover:border-indigo-400/20 hover:bg-white/[.06]">
                        
                        <div class="grid h-10 px-2 place-items-center rounded-lg  bg-gradient-to-br from-blue-600 to-red-600 text-xs font-bold text-white">FR</div>
                        
                        <div class="min-w-0 flex-1">
                            <div class="block text-sm font-semibold text-slate-200">France</div>
                            <div class="mt-0.5 block text-[11px] text-slate-500">15 chaînes en direct</div>
                        </div>

                        <svg class="h-4 w-4 text-slate-500 " fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>



                <div class="flex space-y-2 py-5">
                    
                    <button type="button" data-country="GR" class="btn-pays flex h-16 w-full items-center gap-3 rounded-xl border border-white/5 bg-white/[0.03] px-3 text-left transition hover:border-indigo-400/20 hover:bg-white/[.06]">
                        
                        <span class="grid h-10 px-2 place-items-center rounded-lg  bg-gradient-to-br from-blue-600 to-red-950 text-xs font-bold text-white">GR</span>
                        
                        <span class="min-w-0 flex-1">
                            <span class="block text-sm font-semibold text-slate-200">Greece</span>
                            <span class="mt-0.5 block text-[11px] text-slate-500">15 chaînes en direct</span>
                        </span>

                        <svg class="h-4 w-4 text-slate-500 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>


                <div class="flex space-y-2">
                    
                    <button type="button" data-country="ES" class="btn-pays flex h-16 w-full items-center gap-3 rounded-xl border border-white/5 bg-white/[0.03] px-3 text-left transition hover:border-indigo-400/20 hover:bg-white/[.06]">
                        
                        <span class="grid h-10 px-2 place-items-center rounded-lg  bg-gradient-to-br from-yellow-200 to-red-600 text-xs font-bold text-white">ES</span>
                        
                        <span class="min-w-0 flex-1">
                            <span class="block text-sm font-semibold text-slate-200">Spain</span>
                            <span class="mt-0.5 block text-[11px] text-slate-500">10 chaînes en direct</span>
                        </span>

                        <svg class="h-4 w-4 text-slate-500 transition " fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>

                <div id="channels-list" class="space-y-3 pt-4">
                </div>


        </aside>

            <main class="flex-1  bg-slate-950 ">
                <header class="bg-[#0B0F1A]/90 sticky top-0 z-30 flex h-24  items-center justify-between border-b border-white/5 px-10 ">
                
                    <div class="flex items-center gap-3">
                        <!-- < icon -->
                        <button type="button" class=" grid h-10 w-10 items-center rounded-xl border border-white/[.07] bg-white/[.04] text-slate-300 text-3xl  hover:bg-white/[.06]">
                            <svg class="h-5 w-5 m-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>


                        <div>
                            <p class="text-[11px] font-bold text-indigo-400">EN DIRECT</p>
                            <p class=" mt-1 text-sm font-semibold text-slate-200">Votre télévision, autrement.</p>
                        </div>

                    </div>
                    
                </header>



                <section class="mx-auto max-w-4xl px-10 pt-9 pb-10 ">
                        <!-- <img id="preview-image" src="" alt="" class="h-full w-full object-cover relative aspect-video overflow-hidden rounded-2xl border border-white/10"> -->
                         <video   id="vedio"       width="640" height="360" controls >
                            <source src="ma-video.mp4" type="video/mp4">
                            <source src="ma-video.webm" type="video/webm">
                        </video>
                        <div class="mt-8 flex items-start justify-between gap-6">

                        <div class="">
                            <div class="flex items-center gap-3">
                            <p class="text-xs font-bold text-slate-300">A suivre :</p>
                            <span id="channel-category" class="rounded-lg bg-indigo-500/20 px-3 py-1.5 text-xs font-bold text-indigo-300"></span>
                            <span class="text-xs font-bold px-3 py-1.5 text-green-400 bg-green-200/20 rounded-lg"> Qualité HD</span>
                            <p id="channel-program" class="text-sm text-white"></p>
                            
                            </div>

                            <div class="text-xs font-bold text-slate-300">
                                Channel Number: <p id="channel-number" class="text-xs font-bold text-slate-300"></p>
                            </div>
                            <div  class="text-xs font-bold text-slate-300"></div>
                            <span id="channel-time"></span>
                            <div id="channel-progress" class="text-xs font-bold text-slate-300"></div>
                            
                            <div>
                                <!-- <div id="channel-category" class="text-sm text-white"></div> -->
                                <div id="channel-live" class="text-xs font-bold text-slate-300"></div>
                                <div id="channel-country" class="text-xs font-bold text-slate-300">. LIVE</div>
                            </div>
                        

                            <h1 id="channel-name" class="mt-4 text-5xl font-bold  text-white"></h1>
         
                            <!-- <p id="channel-program" class="mt-4 max-w-md text-lg text-slate-400"></p> -->
                        </div>
                   
                </section>
            </main>
  



    <!-- <footer>
        <p>Service en ligne</p>
    </footer> -->
    
    <!-- Écran de chargement : visible dès le départ -->
    <!-- <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-slate-950">
    <div class="h-12 w-12 animate-spin rounded-full border-4 border-white/10 border-t-indigo-500"></div>
    <p class="text-sm text-slate-300">Chargement des chaînes...</p>
    </div> -->

    <!-- Écran d'erreur : caché au départ -->
    <div id="error" class="flex fixed inset-0 z-50  flex-col items-center justify-center gap-4 bg-slate-950 text-center">
    <p ><img src="img/antenna-svgrepo-com.svg" class="w-20 h-20"  alt=""></p>
    <p class="text-lg font-semibold text-white">Impossible de charger les chaînes</p>
    <p class="text-sm text-slate-400">Vérifiez votre connexion internet.</p>
    <button id="retry" type="button" class="rounded-xl bg-indigo-500 px-5 py-3 text-sm font-semibold text-white hover:bg-indigo-400">
        Réessayer
    </button>
    </div>


   
    <script type="module" src="js/app.js"></script>
</body>
</html>
